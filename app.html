<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V2 Studio</title></head><body style="margin:0;background:#1B1B1B"><div id="v2-loading" style="font:600 14px system-ui;color:#e5e5e4;padding:32px">Carregando V2 Studio…</div><script>
(async()=>{try{const base='https://raw.githubusercontent.com/sebastisnzoth/v2-studio-florianopolis/main/';const [hr,cr,jr]=await Promise.all([fetch(base+'index.html',{cache:'no-store'}),fetch(base+'v2-ai.css',{cache:'no-store'}),fetch(base+'v2-ai-lite.js',{cache:'no-store'})]);if(!hr.ok||!cr.ok||!jr.ok)throw new Error('Falha ao carregar arquivos V2');const [html,css,js]=await Promise.all([hr.text(),cr.text(),jr.text()]);const withCss=html.replace(/<\/head>/i,`<style>${css}</style></head>`);document.open();document.write(withCss);document.close();const blob=new Blob([js],{type:'text/javascript'});const script=document.createElement('script');script.type='module';script.src=URL.createObjectURL(blob);script.onload=()=>URL.revokeObjectURL(script.src);document.body.appendChild(script)}catch(e){document.body.innerHTML='<div style="font:16px system-ui;color:white;padding:32px">V2 Studio — erro ao carregar o site.</div>';console.error(e)}})();
</script></body></html>
